services:
  - type: web
    name: pv-talent-esign
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: pv-talent-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: pv-talent-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: pv-talent-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: pv-talent-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: pv-talent-db
          property: password
      - key: APP_FRONTEND_BASE_URL
        fromService:
          type: web
          name: pv-talent-esign
          envVarKey: RENDER_EXTERNAL_URL
      - key: DEMO_SIGNING_ENABLED
        value: "false"
      - key: ESIGN_PROVIDER
        value: "NOT_CONFIGURED"
      - key: ESIGN_API_URL
        value: ""
      - key: ESIGN_CLIENT_ID
        value: ""
      - key: ESIGN_CLIENT_SECRET
        sync: false
      - key: APP_UPLOAD_DIR
        value: "./uploads"
      - key: EMAIL_PROVIDER
        value: "BREVO"
      - key: BREVO_API_URL
        value: "https://api.brevo.com/v3/smtp/email"
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_FROM_NAME
        value: "PV Talent Partners"
      - key: MAIL_FROM
        value: "pvtalentpartners@gmail.com"
      - key: MAIL_HOST
        value: "smtp.gmail.com"
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        value: "pvtalentpartners@gmail.com"
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_SMTP_AUTH
        value: "true"
      - key: MAIL_SMTP_STARTTLS
        value: "true"

databases:
  - name: pv-talent-db
    plan: free
    region: singapore
    databaseName: pv_talent
    user: pvtalent
