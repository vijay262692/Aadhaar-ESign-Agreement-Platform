spring.application.name=pv-talent-esign
server.port=${PORT:8080}

# PostgreSQL: Render provides host/port/database separately; local defaults are used for development.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pv_talent}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB

# Demo signing is intended only for local testing. Keep false in production.
app.demo-signing-enabled=${DEMO_SIGNING_ENABLED:false}
app.frontend-base-url=${APP_FRONTEND_BASE_URL:http://localhost:8080}
app.upload-dir=${APP_UPLOAD_DIR:./uploads}
app.mail-from=${MAIL_FROM:}

# Email delivery. Render free services cannot use outbound SMTP, so production uses Brevo's HTTPS API.
app.email-provider=${EMAIL_PROVIDER:BREVO}
app.brevo-api-url=${BREVO_API_URL:https://api.brevo.com/v3/smtp/email}
app.brevo-api-key=${BREVO_API_KEY:}

# SMTP remains available for local development or paid Render services.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Production eSign provider settings are supplied through environment variables.
# Do not commit provider credentials, Aadhaar numbers, OTPs, or private keys.
esign.provider=${ESIGN_PROVIDER:NOT_CONFIGURED}
esign.api-url=${ESIGN_API_URL:}
esign.client-id=${ESIGN_CLIENT_ID:}
esign.client-secret=${ESIGN_CLIENT_SECRET:}
