spring.application.name=pv-talent-esign
server.port=${PORT:8080}

# Render supplies DB_URL as postgresql://...; Spring JDBC expects jdbc:postgresql://...
spring.datasource.url=jdbc:${DB_URL:postgresql://localhost:5432/pv_talent}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB

# Demo signing is intended only for local testing. Keep false in production.
app.demo-signing-enabled=${DEMO_SIGNING_ENABLED:false}
app.frontend-base-url=${APP_FRONTEND_BASE_URL:http://localhost:8080}
app.upload-dir=${APP_UPLOAD_DIR:./uploads}

# Production eSign provider settings are supplied through environment variables.
# Do not commit provider credentials, Aadhaar numbers, OTPs, or private keys.
esign.provider=${ESIGN_PROVIDER:NOT_CONFIGURED}
esign.api-url=${ESIGN_API_URL:}
esign.client-id=${ESIGN_CLIENT_ID:}
esign.client-secret=${ESIGN_CLIENT_SECRET:}
