spring.application.name=pv-talent-esign
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/pv_talent
spring.datasource.username=postgres
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB

# Demo signing is intended only for local testing.
app.demo-signing-enabled=true
app.frontend-base-url=http://localhost:8080
app.upload-dir=./uploads
